<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
        <title>{% block title %}{% endblock %}</title>
        {% block styles %}{% endblock %}
    </head>
    <body style="background-color: lightpink; padding-bottom: 50px;"> 
        



        <nav class="navbar navbar-inverse">
            <div class="container-fluid">
                <div class="navbar-header">
                    <a class="navbar-brand" href="#">FinQuest</a>
                </div>
                <ul class="nav navbar-nav">
                    <li class="{{'active' if request.endpoint == 'scan.scanning' else ''}}"><a href="{{url_for('scan.scanning')}}">Scan</a></li>
                    <li class="{{'active' if request.endpoint == 'profile.profiling_page' else ''}}"><a href="{{url_for('profile.profiling_page')}}">Profile</a></li>
                    <li class="{{'active' if request.endpoint == 'terminal.terminal_page' else ''}}"><a href="{{url_for('terminal.terminal_page')}}">Terminal</a></li>
                   
                </ul>
            </div>
        </nav>
        
        {% block content %}
        {% endblock %}
       

    </body>
</html>
